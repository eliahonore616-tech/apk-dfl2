<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#242424">
<title>Gestion des agents – Direction de Suivi des Finances Locales</title>
<style>
@font-face{font-family:'Montserrat';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/montserrat-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/montserrat-latin-ext-wght-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

:root{
  --font:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  /* Palette issue des captures d'écran (Anthracite #242424, Bleu Royal #0A469E, Bleu Ciel #1773C8, Gris clair #F4F4F4) */
  --navy:#242424;--bg:#F4F4F4;--card:#FFFFFF;--line:#DCDCDC;--ink:#1E242B;--muted:#666E78;
  --blue:#0B5CC0;--btn:#0B5CC0;--soft:#E9F1FB;--yellow:#F6C500;--red:#CE1126;--green:#14865A;
  --gsoft:#E2F5EC;--rsoft:#FCE9EB;--asoft:#FFF2C7;--aink:#6B4E00;
  --hero-grad:linear-gradient(180deg,#0A469E 0%,#1773C8 100%);
  --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{--navy:#1A1A1A;--bg:#121212;--card:#1E1E1E;--line:#333333;--ink:#F0F0F0;--muted:#A0A6AE;--blue:#4A9AF5;--btn:#1773C8;
  --soft:#1A2B42;--green:#44C48C;--gsoft:#0E2F25;--rsoft:#3A1519;--asoft:#3A3000;--aink:#FFE08A;--shadow:none}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.25}
h2{font-size:24px}h3{font-size:17px}
p{margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.muted{color:var(--muted)}
.sub{color:var(--muted);font-size:14px;margin-top:4px}

/* ---------- Structure ---------- */
.top{position:sticky;top:0;z-index:25;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;
  padding-top:max(10px,env(safe-area-inset-top));background:var(--navy);color:#fff}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:#fff}
.brand svg{width:36px;height:36px;flex:none}
.brand span{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:16px;font-weight:800}
.brand small{font-size:11.5px;opacity:.75;font-weight:500}
.side{display:none}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;color:var(--muted);text-decoration:none;font-size:10.5px;font-weight:600}
.bnav a[aria-current="page"]{color:var(--blue)}
.bnav a[aria-current="page"]:not(.fab){box-shadow:inset 0 3px 0 var(--blue)}
.bnav .fab span{display:grid;place-items:center;width:52px;height:52px;margin-top:-24px;border-radius:50%;background:var(--btn);color:#fff;
  box-shadow:0 6px 16px rgba(11,92,192,.4);border:4px solid var(--card)}
.bnav .fab small{margin-top:2px}
.ava{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;flex:none}
.top .ava{width:32px;height:32px;text-decoration:none;font-size:14px}
main{padding:16px 14px 104px;max-width:1120px;margin:0 auto}
@media (min-width:900px){
  .top,.bnav{display:none}
  .side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:272px;padding:22px 14px;background:var(--navy);color:#fff;overflow:auto}
  .side .brand{padding:0 8px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}
  .side nav{display:flex;flex-direction:column;gap:2px}
  .side nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#D0D5DD;text-decoration:none;font-weight:600;font-size:14px}
  .side nav a:hover{background:rgba(255,255,255,.08);color:#fff}
  .side nav a[aria-current="page"]{background:var(--btn);color:#fff}
  .side .gl{margin:16px 12px 4px;font-size:12px;font-weight:600;color:#8E96A0}
  .side .who{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.12)}
  .side .who div{display:flex;flex-direction:column;line-height:1.2;min-width:0;flex:1}
  .side .who small{opacity:.7;font-size:12px}
  .side .who b{overflow:hidden;text-overflow:ellipsis}
  .side .ib{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:10px;width:38px;height:38px;display:grid;place-items:center}
  main{margin-left:272px;max-width:none;padding:30px 34px 56px}
  main>*{max-width:1080px}
}

/* ---------- Composants ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.ph{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);text-decoration:none;color:var(--ink);font-weight:600;font-size:14px}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--btn);border-color:var(--btn);color:#fff}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.sm{min-height:36px;padding:0 13px;font-size:13px;border-radius:8px}
.btn:hover{filter:brightness(.96)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
label{display:block;font-size:13px;color:var(--muted);font-weight:600}
input,select,textarea{width:100%;min-height:46px;margin-top:5px;padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px;color:var(--ink)}
input[type=file]{padding:9px}
input[type=radio],input[type=checkbox]{width:20px;height:20px;min-height:0;margin:0;accent-color:var(--btn)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.radios{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px}
label.rd{display:flex;align-items:center;gap:8px;min-height:46px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-weight:500;cursor:pointer}
.empty{padding:34px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px;background:var(--card)}
.warn{display:flex;gap:10px;align-items:flex-start;background:var(--asoft);color:var(--aink);padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:14px}
.warn a{color:inherit;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--blue);white-space:nowrap}
.badge.ok{background:var(--gsoft);color:var(--green)}.badge.warn{background:var(--asoft);color:var(--aink)}.badge.bad{background:var(--rsoft);color:var(--red)}
.narrow{max-width:430px;margin:20px auto}
.narrow form{display:grid;gap:14px;margin-top:16px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:100;max-width:92vw;padding:13px 18px;border-radius:10px;background:var(--navy);color:#fff;
  font-size:14px;font-weight:500;box-shadow:0 8px 28px rgba(0,0,0,.3);display:none}
#toast.err{background:var(--red)}
@media (min-width:900px){#toast{bottom:28px}}
.seg{display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto;margin-bottom:14px}
.seg a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;padding:10px 14px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:700;font-size:13px}
.seg a svg{width:17px;height:17px}
.seg a[aria-current="page"]{background:var(--btn);color:#fff}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.tools input,.tools select{margin-top:0}
.tools .wide{grid-column:1/-1}
@media (min-width:700px){.tools .wide{grid-column:span 2}}
.printhead{display:none;text-align:center;margin-bottom:14px}

/* ---------- Design des captures d'écran ---------- */
.hero{text-align:center}
.hero .hdir{margin-left:auto;margin-right:auto}
.hero .cta{justify-content:center}
.foot{margin-top:34px;padding:24px 16px;border-radius:14px;background:var(--hero-grad);color:#fff;text-align:center;font-size:13px;line-height:1.8;box-shadow:var(--shadow)}
.foot b{font-size:14.5px}
.foot span{opacity:.88;font-size:12px}
.lockhead{display:flex;justify-content:center;margin-bottom:12px}
.lockhead .lk{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--soft);color:var(--blue)}
.narrow .btn{width:100%;border-radius:999px}
fieldset.fsec{border:1px solid var(--line);border-radius:14px;padding:20px;margin:0 0 14px;background:var(--card);box-shadow:var(--shadow);min-width:0}
fieldset.fsec legend{display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:700;font-size:15px}
fieldset.fsec legend i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--btn);color:#fff;font-style:normal;font-size:13px}

/* ---------- Accueil ---------- */
.hero{position:relative;overflow:hidden;border-radius:18px;color:#fff;padding:38px 24px 44px;background:var(--hero-grad);margin-bottom:16px;box-shadow:var(--shadow)}
.pill{display:inline-block;padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.16);font-size:12px;font-weight:600;margin-bottom:14px}
.hero h1{font-size:clamp(22px,4.8vw,34px);font-weight:800;max-width:22em;margin:0 auto}
.hero .hdir{margin-top:10px;font-size:16px;font-weight:600;color:#E3F0FF}
.hero .cta{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.hero .btn{background:#09448C;color:#fff;border-color:rgba(255,255,255,.25);border-radius:999px;padding:0 24px}
.hero .btn:hover{background:#073670}
@media (min-width:760px){.hero{padding:52px 38px 56px}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.stat .ic{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;background:var(--soft);color:var(--blue);flex:none}
.stat .ic.y{background:var(--asoft);color:var(--aink)}.stat .ic.g{background:var(--gsoft);color:var(--green)}.stat .ic.r{background:var(--rsoft);color:var(--red)}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.tile{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.tile:hover{border-color:var(--blue)}
.tile .ic{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;background:var(--soft);color:var(--blue);flex:none}
.tile b{display:block;font-size:15px}.tile span{color:var(--muted);font-size:13px}
.note{margin-top:18px;color:var(--muted);font-size:13px}

/* ---------- Agents ---------- */
#list{display:grid;gap:8px}
.arow{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.arow:hover{border-color:var(--blue)}
.an{display:flex;flex-direction:column;min-width:0}
.an b{overflow:hidden;text-overflow:ellipsis;font-size:14px}
.an small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.am{color:var(--muted);font-size:12px;font-weight:600;text-align:right}
.av{width:50px;height:50px;border-radius:50%;overflow:hidden;background:var(--soft);display:grid;place-items:center;font-weight:800;color:var(--blue);border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--line)}
.av img{width:100%;height:100%;object-fit:cover}

/* ---------- Fiche / modale ---------- */
.mb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);width:100%;max-width:660px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px}
@media (min-width:700px){.mb{align-items:center;padding:20px}.modal{border-radius:18px}}
.fiche-top{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.fiche-top .av{width:92px;height:92px;border-radius:14px;font-size:28px}
.fiche-top h3{font-size:20px}
.fiche-top .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
dl.f{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:16px 0}
dl.f dt{font-size:12px;color:var(--muted);font-weight:600}dl.f dd{margin:0;font-weight:600;word-break:break-word;font-size:14px}
.placed{display:grid;gap:6px;margin:6px 0 14px}
.placed a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--soft);color:var(--ink);text-decoration:none;font-size:13.5px}
.placed a svg{width:20px;height:20px;color:var(--blue);flex:none}
.placed a b{display:block}
.okhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.okhead .ic{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--gsoft);color:var(--green)}

/* ---------- Formulaire ---------- */
.fsec{margin-bottom:14px}
.fsec h3{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:15px}
.fsec h3 i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--btn);color:#fff;font-style:normal;font-size:13px}
.photo-box{display:flex;gap:14px;align-items:center}
.photo-box .av{width:88px;height:88px;border-radius:14px;flex:none;font-size:26px}
.formbar{position:sticky;bottom:70px;display:flex;gap:10px;padding:12px 0}
@media (min-width:900px){.formbar{bottom:0}}

/* ---------- Tableaux ---------- */
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow);max-height:72vh}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.tbl th{position:sticky;top:0;z-index:2;background:var(--navy);color:#fff;text-align:left;padding:11px 12px;font-weight:700;white-space:nowrap;font-size:12.5px}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover td{background:var(--soft)}
.tbl .s1,.tbl .s2{position:sticky;background:var(--card);z-index:1}
.tbl th.s1,.tbl th.s2{background:var(--navy);z-index:3}
.tbl .s1{left:0;min-width:46px}.tbl .s2{left:46px;min-width:210px;font-weight:700}
.tbl tfoot td{font-weight:800;background:var(--soft);border-bottom:0}
.tbl td.c,.tbl th.c{text-align:center}
.tbl input.num{width:76px;min-height:38px;margin:0;text-align:center;padding:4px}

/* ---------- Mise en place / cadre ---------- */
.dv{margin-bottom:12px}
.dv>header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.dv>header small{color:var(--muted);font-size:12.5px;display:block}
.dv .cnt{text-align:right}.dv .cnt b{font-size:22px;font-weight:800;display:block;line-height:1.1}
.alist{display:grid;gap:6px}
.alist .arow{border-radius:10px;padding:8px 10px;box-shadow:none}
.alist .av{width:42px;height:42px;font-size:13px}
.alist .arow{grid-template-columns:42px 1fr auto}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:2px 0 12px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--green)}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);font-weight:800;text-decoration:underline;font-size:13px}
.addpost{display:flex;gap:8px;margin-top:12px}.addpost input{margin-top:0}

/* ---------- Tableau de bord ---------- */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.chart h3{margin-bottom:12px;font-size:15px}
.bar{display:grid;grid-template-columns:minmax(80px,38%) 1fr 62px;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.bar .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.bar .t{height:11px;border-radius:6px;background:var(--line);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:6px;background:var(--blue)}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.dn{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dn ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}
.dn li i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px}

/* ---------- Administration / Base de données ---------- */
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list li{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.list em{color:var(--muted);font-style:normal;font-size:13px;margin-left:6px}
.dir{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.dh{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:8px}
.chips{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chips li{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.chips .chip{border:0;background:none;padding:6px 12px;font-size:13px}
.chips .x{border:0;border-left:1px solid var(--line);background:none;padding:0 11px;color:var(--red);font-size:18px}
.inline{display:flex;gap:8px}.inline input{margin-top:0}.inline .btn{flex:none}
.sec2{margin-top:14px}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 16px;border:2px dashed var(--line);border-radius:14px;text-align:center;cursor:pointer;color:var(--muted)}
.drop svg{width:34px;height:34px;color:var(--blue)}
.drop b{color:var(--ink)}
details.map{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
details.map summary{cursor:pointer;font-weight:700;font-size:13.5px}
details.map .grid{margin-top:12px}
.kv{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.db-box{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--soft);margin-bottom:12px}
.db-box .ic{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;background:var(--btn);color:#fff;flex:none}

@media print{
  @page{size:A4 landscape;margin:12mm}
  .top,.bnav,.side,#toast,.noprint,.tools,.seg{display:none!important}
  main{margin:0;padding:0;max-width:none}
  body{background:#fff;color:#000}
  .printhead{display:block}
  .card,.tw{box-shadow:none;max-height:none;overflow:visible}
  .tbl th{background:#e6ebf3!important;color:#000!important}
  .tbl .s1,.tbl .s2{position:static}

      else if (this.kind !== 'mem') await this.writeRaw(DBFILE, JSON.stringify(this.mem));
    } catch (e) { toast('Erreur d’enregistrement de la base de données', true); }
    this.busy = false;
  },
  where() {
    if (this.kind === 'desktop') return window.dflDesktop.where();
    if (this.kind === 'native') return Promise.resolve('Stockage interne de l’application (dossier dfl, fichier ' + DBFILE + ')');
    return Promise.resolve(this.kind === 'idb' ? 'Stockage interne local de l’appareil (IndexedDB sécurisé)' : 'Mémoire temporaire');
  }
};

async function parsePdf(buf) {

    items.forEach(it => { const r = rows.find(r => Math.abs(r.y - it.y) <= 3); if (r) r.items.push(it); else rows.push({ y: it.y, items: [it] }); });
    rows.forEach(r => { r.items.sort((a, b) => a.x - b.x); const ch = []; r.items.forEach(it => { const l = ch[ch.length - 1]; if (l && it.x - (l.x + l.w) < 5) { l.s += ' ' + it.s; l.w = it.x + it.w - l.x; } else ch.push({ ...it }); }); lines.push(ch); });
  }
  if (!lines.length) throw new Error('Ce PDF ne contient pas de texte lisible (document scanné). Utilisez un PDF créé depuis Word ou Excel, ou un fichier Excel.');
  const keys = AKEYS.concat(['prevu']); let hdr = null;
  for (const ch of lines) if (Object.keys(autoMap(ch.map(c => c.s), keys)).length >= 3) { hdr = ch; break; }
  if (!hdr) return [{ name: 'PDF', aoa: lines.map(ch => ch.map(c => c.s)) }];
  const xs = hdr.map(c => c.x), aoa = [hdr.map(c => c.s)];
  lines.forEach(ch => {
    if (ch === hdr || Object.keys(autoMap(ch.map(c => c.s), keys)).length >= 3) return;
    const row = new Array(xs.length).fill('');
    ch.forEach(c => { let ci = 0; xs.forEach((x, i) => { if (c.x >= x - 6) ci = i; }); row[ci] = (row[ci] ? row[ci] + ' ' : '') + c.s; });
    aoa.push(row);

}

    DB.agents.forEach(a => { if (a.direction === d.name) a.direction = n; }); DB.cadre.forEach(c => { if (c.direction === d.name) c.direction = n; }); d.name = n; save(); route();
  },
  deldir: t => { const d = DB.directions[+t.dataset.i]; if (DB.agents.some(a => a.direction === d.name)) return toast('Cette direction contient encore des agents', true); if (DB.directions.length < 2) return toast('Il faut garder au moins une direction', true); if (confirm(`Supprimer la direction « ${d.name} » ?`)) { DB.cadre = DB.cadre.filter(c => c.direction !== d.name); DB.directions.splice(+t.dataset.i, 1); save(); route(); } },
  rendiv: async t => {
    const d = DB.directions[+t.dataset.i], old = d.divisions[+t.dataset.j], n = ((await ask('Nouveau nom de la division :', old)) || '').trim(); if (!n || n === old) return;
    if (d.divisions.includes(n)) return toast('Ce nom existe déjà', true);
    DB.agents.forEach(a => { if (a.direction === d.name && a.division === old) a.division = n; }); DB.cadre.forEach(c => { if (c.direction === d.name && c.division === old) c.division = n; });
    d.divisions[+t.dataset.j] = n; save(); route();
  },
  deldiv: t => { const d = DB.directions[+t.dataset.i], v = d.divisions[+t.dataset.j]; if (DB.agents.some(a => a.direction === d.name && a.division === v)) return toast('Cette division contient encore des agents', true); if (confirm(`Supprimer la division « ${v} » ?`)) { DB.cadre = DB.cadre.filter(c => !(c.direction === d.name && c.division === v)); d.divisions.splice(+t.dataset.j, 1); save(); route(); } },
  flushdb: async () => { await Store.flush(); toast('Base de données enregistrée dans le stockage interne'); route(); },
  cloudbackup: async () => {
    DB.meta.lastBackup = Date.now(); save();
    const fname = `cloud_agents_DFL_${today()}.json`;
    const payload = JSON.stringify(DB);
    if (navigator.share && navigator.canShare) {
      try {
        const file = new File([payload], fname, { type: 'application/json' });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ title: 'Sauvegarde Base de Données DFL', text: 'Archive complète des agents (Cloud)', files: [file] });
          route(); return;
        }
      } catch (e) {}
    }
    await saveFile(fname, payload, 'application/json');
    toast('Fichier prêt à être déposé sur Google Drive, OneDrive ou iCloud');
    route();
  },
  copyjson: async () => {
    try {
      await navigator.clipboard.writeText(JSON.stringify(DB));
      toast('Base de données copiée dans le presse-papiers');
    } catch (e) { toast('Copie impossible sur ce navigateur', true); }
  },
  backup: async () => { DB.meta.lastBackup = Date.now(); save(); await saveFile(`archive_lieu_sur_DFL_${today()}.json`, JSON.stringify(DB), 'application/json'); toast('Archive téléchargée : placez-la en lieu sûr'); route(); },
  exportall: () => exportTable('agents_DFL_' + today(), ['Nom', 'Postnom', 'Prénom', 'Date de naissance', 'Sexe', 'État civil', 'Diplôme', 'Matricule', 'N° acte d’engagement', 'Date d’engagement', 'Grade', 'Fonction', 'Direction', 'Division', 'Bureau', 'Salaire', 'Prime', 'Prise en charge', 'Situation'],
    DB.agents.map(a => [a.nom, a.postnom, a.prenom, fmtDate(a.naissance), SEX[a.sexe] || '', a.etat_civil, a.diplome, a.matricule, a.acte, fmtDate(a.engagement), a.grade, a.fonction, a.direction, a.division, a.bureau, a.salaire, a.prime, a.prise_en_charge, a.situation])),
  exp: t => { const k = t.dataset.k, r = docRows(k); exportTable({ 'mise-en-place': 'mise_en_place', cadre: 'cadre_organique', liste: 'liste_declarative_' + DB.meta.annee }[k] + '_DFL_' + today(), r.header, r.rows); },
  template: () => exportTable('modele_agents_DFL', ['Matricule', 'Nom', 'Postnom', 'Prénom', 'Sexe', 'Date de naissance', 'État civil', 'Diplôme', 'N° acte d’engagement', 'Date d’engagement', 'Grade', 'Fonction', 'Direction', 'Division', 'Bureau', 'Salaire', 'Prime', 'Situation'], []),
  openfolder: () => window.dflDesktop && window.dflDesktop.open(),
  wipe: async () => { if (!DB.agents.length) return toast('Aucun agent à supprimer'); if ((await ask(`Cette action est définitive. Tapez SUPPRIMER pour effacer les ${DB.agents.length} agents :`)) === 'SUPPRIMER') { DB.agents = []; save(); toast('Tous les agents ont été supprimés'); route(); } },
  enplace: t => { const L = sortAgents(DB.agents.filter(a => a.direction === t.dataset.dir && (a.division || '') === t.dataset.div && norm(a.grade || 'Grade non renseigné') === norm(t.dataset.grade)), 'hier'); openModal(`<h3 style="margin-bottom:12px">${esc(t.dataset.grade)}</h3><p class="sub" style="margin-bottom:12px">${esc(t.dataset.div || 'Sans division')} — ${L.length} agent${L.length > 1 ? 's' : ''}</p><div class="alist">${L.map(agentRow).join('')}</div><div class="acts" style="margin-top:14px"><button class="btn" data-act="close">Fermer</button></div>`); },
  cadrerm: t => { DB.cadre = DB.cadre.filter(c => c.id !== t.dataset.id); save(); renderCadre(); },
  impapply: () => {
    const res = buildImport(); let nw = 0, up = 0;
    const dirOf = n => { let d = DB.directions.find(x => norm(x.name) === norm(n || imp.dir)); if (!d) { d = { name: n || imp.dir, divisions: [] }; DB.directions.push(d); } return d; };
    if (imp.mode === 'agents') {
      res.items.forEach(c => {
        const d = dirOf(c.direction); c.direction = d.name; if (c.division) { c.division = matchDivision(c.division, d.divisions); if (!d.divisions.includes(c.division)) d.divisions.push(c.division); }
        const ex = DB.agents.find(a => agentKey(a) === agentKey(c));
        if (ex) { for (const k in c) if (c[k]) ex[k] = c[k]; ex.updated = Date.now(); up++; } else { DB.agents.push({ id: uid(), photo: '', created: Date.now(), updated: Date.now(), ...c, situation: c.situation || 'Actif' }); nw++; }
      });
      save(); toast(`Import terminé : ${nw} ajouté(s), ${up} mis à jour`); afterRoute = null; location.hash = '#/liste'; route();
    } else {
      res.items.forEach(c => {
        const d = dirOf(c.direction); c.direction = d.name; if (c.division) { c.division = matchDivision(c.division, d.divisions); if (!d.divisions.includes(c.division)) d.divisions.push(c.division); }
        const ex = DB.cadre.find(x => x.direction === c.direction && x.division === c.division && norm(x.grade) === norm(c.grade));
        if (ex) { ex.prevu = c.prevu; if (c.note) ex.note = c.note; up++; } else { DB.cadre.push({ id: uid(), ...c }); nw++; }
      });
      save(); toast(`Cadre organique : ${nw} poste(s) ajouté(s), ${up} mis à jour`); location.hash = '#/cadre'; route();
    }
  }
};

/* ================= Formulaires ================= */
const F = {
  async login(f) {
    const u = f.u.value.trim().toLowerCase(), user = DB.users.find(x => x.username.toLowerCase() === u);
    if (!user) return toast('Identifiant ou mot de passe incorrect', true);
    const p = f.p.value, ok = user.pass.length === 64 ? user.pass === await sha256(p) : user.pass === hash(p);
    if (!ok) return toast('Identifiant ou mot de passe incorrect', true);
    if (user.pass.length !== 64) { user.pass = await sha256(p); save(); }
    session = { id: user.id, username: user.username, role: user.role, mustChange: !!user.mustChange };
    try { localStorage.setItem('dfl_s', JSON.stringify(session)); } catch (e) {}
    const n = user.mustChange ? 'compte' : (nextRoute || 'accueil'); nextRoute = ''; location.hash = '#/' + n; route();
  },
  async pw(f) {
    const user = DB.users.find(x => x.id === session.id);
    const oldOK = user.pass.length === 64 ? user.pass === await sha256(f.old.value) : user.pass === hash(f.old.value);
    if (!oldOK) return toast('Le mot de passe actuel est incorrect', true);
    if (f.n1.value !== f.n2.value) return toast('Les deux nouveaux mots de passe sont différents', true);
    if (f.n1.value.length < 6 || f.n1.value.toLowerCase() === 'admin') return toast('Choisissez un mot de passe d’au moins 6 caractères, différent de « admin »', true);
    user.pass = await sha256(f.n1.value); user.mustChange = false; session.mustChange = false;
    try { localStorage.setItem('dfl_s', JSON.stringify(session)); } catch (e) {}
    save(); toast('Mot de passe modifié'); location.hash = '#/accueil'; route();
  },
  async adduser(f) { const u = f.u.value.trim(); if (DB.users.some(x => x.username.toLowerCase() === u.toLowerCase())) return toast('Cet identifiant existe déjà', true); DB.users.push({ id: uid(), username: u, pass: await sha256(f.p.value), role: f.r.value, mustChange: false }); save(); toast('Utilisateur ajouté'); route(); },
  adddir(f) { const v = f.v.value.trim(); if (DB.directions.some(d => d.name === v)) return toast('Cette direction existe déjà', true); DB.directions.push({ name: v, divisions: [] }); save(); route(); },
  adddiv(f) { const d = DB.directions[+f.dataset.i], v = f.v.value.trim(); if (d.divisions.includes(v)) return toast('Cette division existe déjà', true); d.divisions.push(v); save(); route(); },
  year(f) { DB.meta.annee = parseInt(f.y.value, 10) || DB.meta.annee; save(); toast('Année enregistrée'); },
  addpost(f) {
    const dir = f.dataset.dir, div = f.dataset.div, g = f.g.value.trim(), p = Math.max(0, parseInt(f.p.value, 10) || 0), ex = DB.cadre.find(c => c.direction === dir && c.division === div && norm(c.grade) === norm(g));
    if (ex) ex.prevu = p; else DB.cadre.push({ id: uid(), direction: dir, division: div, grade: g, prevu: p, note: '' });
    save(); renderCadre();
  },
  agent(f) {
    const g = n => (f.elements[n] ? f.elements[n].value : '').trim(), id = f.dataset.id, o = {};
    ['nom', 'postnom', 'prenom', 'naissance', 'etat_civil', 'diplome', 'matricule', 'acte', 'engagement', 'grade', 'fonction', 'direction', 'division', 'bureau', 'prise_en_charge', 'situation'].forEach(k => o[k] = g(k));
    ['sexe', 'salaire', 'prime'].forEach(k => o[k] = (f.querySelector(`input[name=${k}]:checked`) || {}).value || ''); o.photo = formPhoto;
    const dup = o.matricule && DB.agents.find(a => a.matricule && a.id !== id && a.matricule.toLowerCase() === o.matricule.toLowerCase());
    if (dup) return toast(`Ce matricule existe déjà : ${fullName(dup)}`, true);
    let a;
    if (id) { a = DB.agents.find(x => x.id === id); Object.assign(a, o, { updated: Date.now() }); } else { a = { id: uid(), created: Date.now(), updated: Date.now(), ...o }; DB.agents.push(a); }
    const dv = o.division; if (dv) { const d = DB.directions.find(x => x.name === o.direction); if (d && !d.divisions.includes(dv)) d.divisions.push(dv); }
    if (o.division && o.bureau && DB.org) {
      const od = DB.org.divisions.find(x => x.name === o.division);
      if (od && !od.bureaux.some(b => b.name === o.bureau)) od.bureaux.push({ id: uid(), name: o.bureau, cb: '' });
    }
    syncOrgToDirections();
    save();
    if (id) { toast('Fiche modifiée'); location.hash = '#/liste'; return; }
    const rank = sortAgents(DB.agents.filter(x => x.direction === a.direction), 'hier').findIndex(x => x.id === a.id) + 1;
    afterRoute = () => openModal(`<div class="okhead"><span class="ic">${ico('check', 24)}</span><div><h3>Agent enregistré</h3><span class="muted" style="font-size:13px">${esc(fullName(a))}</span></div></div>
      <p class="sub" style="margin-bottom:10px">Ses informations ont été placées automatiquement dans les 3 documents :</p><div class="placed">
      <a href="#/mise-en-place" data-act="close">${ico('layers', 20)}<span><b>Mise en place</b>${esc(a.division || 'Sans division')}</span></a>
      <a href="#/cadre" data-act="close">${ico('org', 20)}<span><b>Cadre organique</b>${esc(a.grade || 'Grade non renseigné')}</span></a>
      <a href="#/liste" data-act="close">${ico('list', 20)}<span><b>Liste déclarative</b>N° ${rank} sur ${DB.agents.filter(x => x.direction === a.direction).length}</span></a></div>
      <div class="acts"><a class="btn primary" href="#/nouveau" data-act="close">Ajouter un autre agent</a><button class="btn" data-act="close">Fermer</button></div>`);
    location.hash = '#/liste';
  }
};

document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t) return; const fn = A[t.dataset.act]; if (fn) fn(t, e); });
document.addEventListener('submit', e => { const f = e.target; if (!f.dataset || !F[f.dataset.f]) return; e.preventDefault(); F[f.dataset.f](f); });
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.matches('input[data-prevu]')) {
    const v = Math.max(0, parseInt(t.value, 10) || 0), dir = t.dataset.dir, div = t.dataset.div, g = t.dataset.grade;
    const ex = DB.cadre.find(c => c.direction === dir && c.division === div && norm(c.grade) === norm(g));
    if (ex) ex.prevu = v; else DB.cadre.push({ id: uid(), direction: dir, division: div, grade: g, prevu: v, note: '' });
    save(); renderCadre(); return;
  }
  if (t.name === 'impMode' && imp) { imp.mode = t.value; setupTables(); renderPreview(); return; }
  if (t.id === 'impDir' && imp) { imp.dir = t.value; renderPreview(); return; }
  if (t.id === 'impSheet' && imp) { imp.sheetAsDiv = t.checked; renderPreview(); return; }
  if (t.dataset && t.dataset.imp && imp) {
    const [ti, k] = t.dataset.imp.split('|'), tb = imp.tables[+ti], keys = imp.mode === 'agents' ? AKEYS : CKEYS;
    if (k === 'hi') { tb.hi = Math.max(0, (parseInt(t.value, 10) || 1) - 1); tb.map = autoMap(tb.aoa[tb.hi] || [], keys); } else if (t.value === '') delete tb.map[k]; else tb.map[k] = +t.value;
    renderPreview(); const d = $$('#impPreview details')[+ti]; if (d) d.open = true; return;
  }
  const file = t.files && t.files[0]; if (!file) return;
  if (t.id === 'impFile' && imp) {
    $('#impPreview').innerHTML = '<div class="card"><p>Lecture du fichier…</p></div>';
    try {
      imp.tables = (await parseFile(file)).filter(x => x.aoa.length); imp.mode = ($('input[name=impMode]:checked') || {}).value || 'agents'; imp.dir = $('#impDir').value; imp.sheetAsDiv = $('#impSheet').checked;
      if (!imp.tables.length) throw new Error('Le fichier est vide.'); setupTables(); renderPreview();
    } catch (err) {
      imp.tables = []; $('#impPreview').innerHTML = `<div class="warn">${ico('alert', 20)}<span>${esc(err.message === 'lib' ? 'Module de lecture indisponible dans cette version.' : err.message)}</span></div>`;
    }
    t.value = '';
  }
  if (t.id === 'impJson') {
    try {
      const d = JSON.parse(await file.text());
      if (!d || !Array.isArray(d.agents) || !Array.isArray(d.users) || !Array.isArray(d.directions)) throw 0;
      if (!confirm(`Remplacer toutes les données actuelles par cette sauvegarde (${d.agents.length} agents) ?`)) return;
      DB = migrate(d); save();
      const me = DB.users.find(u => u.id === session.id) || DB.users.find(u => u.username === session.username);
      if (me) session = { id: me.id, username: me.username, role: me.role, mustChange: !!me.mustChange }; else { session = null; location.hash = '#/login'; }
      toast('Sauvegarde restaurée'); route();
    } catch (err) { toast('Ce fichier n’est pas une sauvegarde valide', true); }
    t.value = '';
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
window.addEventListener('afterprint', () => document.body.classList.remove('printing'));
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (document.hidden) Store.flush(); });
window.addEventListener('pagehide', () => Store.flush());

/* Déconnexion automatique après 15 minutes d'inactivité */
let idle; const IDLE = 15 * 60 * 1000;
const bump = () => { clearTimeout(idle); if (session) idle = setTimeout(() => { if (session) { A.logout(); toast('Session fermée après 15 minutes d’inactivité'); } }, IDLE); };
['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, bump, { passive: true }));

/* ================= Démarrage ================= */
(async () => {
  await Store.open();
  let d = await Store.get();
  DB = (d && Array.isArray(d.agents)) ? migrate(d) : seed();
  if ((Store.kind === 'native' || Store.kind === 'desktop') && DB.meta.lastAuto !== today()) { try { await Store.writeRaw(AUXFILE, JSON.stringify(DB)); DB.meta.lastAuto = today(); } catch (e) {} save(); }
  save();
  try { const s = localStorage.getItem('dfl_s'); if (s) { const x = JSON.parse(s); if (DB.users.some(u => u.id === x.id)) session = x; } } catch (e) {}
  route(); bump();
})();
})();
</script>
</body>
