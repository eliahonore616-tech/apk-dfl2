name: Construire l'APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p www && cp index.html www/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Icône de l'application
        run: |
          mkdir -p assets
          cp icon-only.png icon-foreground.png icon-background.png assets/
          npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#0B3C9E' --iconBackgroundColorDark '#0B3C9E'
        continue-on-error: true
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: Gestion_Agents_DFL_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
        continue-on-error: true
